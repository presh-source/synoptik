name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - release
      - production
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  NODE_VERSION: '18'
  TERRAFORM_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'
  DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Fetch last 50 commits (faster than full history)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build application
        working-directory: frontend
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_PROJECT_NAME: ${{ env.PROJECT_NAME }}
          VITE_API_URL: ${{ steps.targets.outputs.dashboard_api_url }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
          VITE_DASHBOARD_APPSYNC_API_URL: ${{ steps.targets.outputs.dashboard_dashboard_dashboard_appsync_api_url }}
          VITE_APPSYNC_API_KEY: ${{ steps.targets.outputs.dashboard_appsync_api_key }}
          VITE_APPSYNC_REALTIME_URL: ${{ steps.targets.outputs.dashboard_appsync_realtime_url }}
          VITE_ENVIRONMENT: ${{ env.DEPLOY_ENV }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get deployment targets from Terraform
        id: targets
        working-directory: backend
        run: |
          terraform init \
          -backend-config=environments/${{ env.DEPLOY_ENV }}/backend.tfvars \
          -lock=false
          
          # Check if outputs exist (infrastructure must be applied first)
          if ! terraform output dashboard_bucket_name &>/dev/null; then
            echo "::error::Infrastructure not yet deployed. Please run backend deployment first."
            echo "::error::Run: cd backend && terraform apply -var-file=environments/${{ env.DEPLOY_ENV }}/terraform.tfvars"
            exit 1
          fi
          
          # Extract deployment targets
          BUCKET_NAME=$(terraform output -raw dashboard_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          
          # Extract API endpoints and keys for frontend build
          DASHBOARD_dashboard_appsync_api_url=$(terraform output -raw dashboard_dashboard_appsync_api_url)
          DASHBOARD_APPSYNC_API_KEY=$(terraform output -raw dashboard_appsync_api_key)
          DASHBOARD_APPSYNC_REALTIME_URL=$(terraform output -raw dashboard_appsync_realtime_url)
          DASHBOARD_API_URL=$(terraform output -raw dashboard_api_url)
          
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "null" ]; then
            echo "::error::Dashboard bucket not found in Terraform state"
            exit 1
          fi
          
          # Output to GitHub Actions
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "dashboard_api_url=$DASHBOARD_API_URL" >> $GITHUB_OUTPUT
          echo "dashboard_dashboard_appsync_api_url=$DASHBOARD_dashboard_appsync_api_url" >> $GITHUB_OUTPUT
          echo "dashboard_appsync_api_key=$DASHBOARD_APPSYNC_API_KEY" >> $GITHUB_OUTPUT
          echo "dashboard_appsync_realtime_url=$DASHBOARD_APPSYNC_REALTIME_URL" >> $GITHUB_OUTPUT
          
          echo "Deployment targets:"
          echo "  S3: $BUCKET_NAME"
          echo "  CloudFront: $DISTRIBUTION_ID"
          echo "  AppSync: $DASHBOARD_dashboard_appsync_api_url"
          echo "  API Gateway: $DASHBOARD_API_URL"

      - name: Deploy to S3
        working-directory: frontend
        run: |
          echo "Deploying to environment: ${{ env.DEPLOY_ENV }}"
          if [ "${{ env.DEPLOY_ENV }}" = "prod" ]; then
            echo "WARNING: Production deployment requires GitHub Environment protection and reviewer approval."
          fi
          
          aws s3 sync dist/ s3://${{ steps.targets.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          
          aws s3 cp dist/index.html s3://${{ steps.targets.outputs.bucket_name }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront distribution: ${{ steps.targets.outputs.distribution_id }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.targets.outputs.distribution_id }} \
            --paths "/*"

      - name: Create Sentry release for frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: "${{ env.PROJECT_NAME }}-frontend"
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto --ignore-missing
          sentry-cli releases finalize "${{ github.sha }}"
          sentry-cli releases deploys "${{ github.sha }}" new -e ${{ env.DEPLOY_ENV }}

      - name: Deployment summary
        run: |
          echo "### Frontend Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action || 'deploy' }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ steps.targets.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront Distribution:** ${{ steps.targets.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY