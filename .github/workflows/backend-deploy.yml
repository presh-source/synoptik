name: Deploy Backend (Infrastructure)

on:
  push:
    branches:
      - develop
      - release
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm:
        description: 'Confirm apply for prod (must be "yes" to allow apply)'
        required: false
        default: 'no'
        type: choice
        options:
          - yes
          - no

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  AWS_REGION: 'us-east-1'
  TERRAFORM_VERSION: '1.5.0'
  DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Use the environment for GitHub Environment secrets
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for Sentry release comparison

      - name: Verify deployment progression (staging requires dev, prod requires staging)
        if: github.event.inputs.action == 'apply' && (env.DEPLOY_ENV == 'staging' || env.DEPLOY_ENV == 'prod')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_ENV="${{ env.DEPLOY_ENV }}"
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          
          echo "Checking deployment progression for ${CURRENT_ENV}..."
          
          # Determine required previous environment
          if [ "${CURRENT_ENV}" = "staging" ]; then
            REQUIRED_ENV="dev"
          elif [ "${CURRENT_ENV}" = "prod" ]; then
            REQUIRED_ENV="staging"
          fi
          
          echo "Verifying commit ${COMMIT_SHA} was deployed to ${REQUIRED_ENV}..."
          
          # Check if this commit was successfully deployed to the required environment
          DEPLOYED=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/deployments" \
            --jq ".[] | select(.sha == \"${COMMIT_SHA}\" and .environment == \"${REQUIRED_ENV}\" and .task == \"deploy\") | .id" \
            | head -n 1)
          
          if [ -z "$DEPLOYED" ]; then
            echo "::error::Deployment to ${CURRENT_ENV} blocked: commit ${COMMIT_SHA} has not been deployed to ${REQUIRED_ENV} yet."
            echo "::error::Please deploy to ${REQUIRED_ENV} first to follow the progression: dev → staging → prod"
            exit 1
          fi
          
          # Check if the deployment to required env was successful
          DEPLOYMENT_STATUS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/deployments/${DEPLOYED}/statuses" \
            --jq ".[0].state")
          
          if [ "$DEPLOYMENT_STATUS" != "success" ]; then
            echo "::error::Deployment to ${CURRENT_ENV} blocked: deployment to ${REQUIRED_ENV} is in state '${DEPLOYMENT_STATUS}', not 'success'."
            echo "::error::Please ensure ${REQUIRED_ENV} deployment completes successfully before deploying to ${CURRENT_ENV}."
            exit 1
          fi
          
          echo "Verified: commit ${COMMIT_SHA} was successfully deployed to ${REQUIRED_ENV}"
          echo "Proceeding with ${CURRENT_ENV} deployment..."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.ROLE_NAME || 'GitHubOIDCRole' }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: backend
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: backend
        run: |
          terraform init \
            -backend-config=environments/${{ env.DEPLOY_ENV }}/backend.tfvars

      - name: Terraform Validate
        working-directory: backend
        run: terraform validate

      - name: Terraform Plan
        working-directory: backend
        run: |
          terraform plan \
            -var-file=environments/${{ env.DEPLOY_ENV }}/terraform.tfvars \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="github_token=${{ secrets.GH_TOKEN_SECRET }}" \
            -var="sentry_dsn_frontend=${{ secrets.SENTRY_DSN_FRONTEND }}" \
            -var="sentry_dsn_backend=${{ secrets.SENTRY_DSN_BACKEND }}" \
            -var="app_version=${{ github.sha }}" \
            -out=tfplan

      

      - name: Create deployment record
        if: github.event.inputs.action == 'apply' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          COMMIT_SHA="${{ github.sha }}"
          ENV="${{ env.DEPLOY_ENV }}"
          
          echo "Creating deployment record for ${ENV}..."
          
          # Create deployment
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/deployments" \
            -f ref="${COMMIT_SHA}" \
            -f environment="${ENV}" \
            -f task="deploy" \
            -f auto_merge=false \
            -f required_contexts="[]" \
            --jq '.id')
          
          echo "Deployment ID: ${DEPLOYMENT_ID}"
          
          # Mark deployment as successful
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f environment="${ENV}" \
            -f description="Terraform apply completed successfully"
          
          echo "Deployment record created and marked as successful"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'yes'
        working-directory: backend
        run: |
          echo "Requested destroy for environment: ${{ env.DEPLOY_ENV }}"
          if [ "${{ env.DEPLOY_ENV }}" = "prod" ]; then
            echo "WARNING: Destroy in PROD requires GitHub Environment protection and reviewer approval."
          fi
          terraform destroy \
            -var-file=environments/${{ env.DEPLOY_ENV }}/terraform.tfvars \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="github_token=${{ secrets.GH_TOKEN_SECRET }}" \
            -var="sentry_dsn_frontend=${{ secrets.SENTRY_DSN_FRONTEND }}" \
            -var="sentry_dsn_backend=${{ secrets.SENTRY_DSN_BACKEND }}" \
            -var="app_version=${{ github.sha }}" \
            -auto-approve

      - name: Get Terraform Outputs
        if: github.event.inputs.action != 'destroy'
        working-directory: backend
        continue-on-error: true
        run: |
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No outputs available yet" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Sentry release for backend
        if: (github.event.inputs.action == 'apply' || github.event_name == 'push') && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: "${{ env.PROJECT_NAME }}-backend"
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          
          # Create release
          sentry-cli releases new "${{ github.sha }}"
          
          # Associate commits (with fallback for missing previous release)
          sentry-cli releases set-commits "${{ github.sha }}" --auto --ignore-missing || \
            echo "Warning: Could not determine previous release, using recent commits"
          
          # Finalize and deploy
          sentry-cli releases finalize "${{ github.sha }}"
          sentry-cli releases deploys "${{ github.sha }}" new -e ${{ env.DEPLOY_ENV }}

      - name: Deployment summary
        run: |
          echo "### Backend Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action || 'plan' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY