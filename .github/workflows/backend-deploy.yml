name: Deploy Backend (Infrastructure)

on:
  push:
    branches:
      - develop
      - release
      - production
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'Confirm apply for prod (must be "yes" to allow apply)'
        required: false
        default: 'no'
        type: choice
        options:
          - yes
          - no

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  AWS_REGION: 'us-east-1'
  TERRAFORM_VERSION: '1.5.0'
  DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}

permissions:
  id-token: write      # Required for AWS OIDC authentication
  contents: read       # Required for checking out code
  deployments: write   # Required for creating deployment records

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Use the environment for GitHub Environment secrets
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (startsWith(github.ref, 'refs/heads/release/') && 'staging') || (github.ref == 'refs/heads/develop' && 'dev') || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check (Linting)
        run: |
          echo "### Ruff Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ruff check backend/ --output-format=github || {
            echo "Ruff linting failed. Please fix the issues before deploying." >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "Ruff linting passed" >> $GITHUB_STEP_SUMMARY

      - name: Ruff Format Check
        run: |
          echo "### Ruff Format Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ruff format --check backend/ || {
            echo "Ruff format check failed. Please run 'ruff format backend/' to fix formatting." >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "Ruff format check passed" >> $GITHUB_STEP_SUMMARY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        working-directory: backend
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: backend
        run: |
          terraform init \
            -backend-config=environments/${{ env.DEPLOY_ENV }}/backend.tfvars \
            -lock=false

      - name: Terraform Validate
        working-directory: backend
        run: terraform validate

      - name: Terraform Plan
        working-directory: backend
        run: |
          terraform plan \
            -var-file=environments/${{ env.DEPLOY_ENV }}/terraform.tfvars \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="github_token=${{ secrets.GH_TOKEN_SECRET }}" \
            -var="sentry_dsn_frontend=${{ secrets.SENTRY_DSN_FRONTEND }}" \
            -var="sentry_dsn_backend=${{ secrets.SENTRY_DSN_BACKEND }}" \
            -var="app_version=${{ github.sha }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: backend
        run: |
          if [ ! -f tfplan ]; then
            echo "tfplan not found — run terraform plan first"
            exit 1
          fi
          terraform apply -input=false -auto-approve tfplan

      - name: Get Terraform Outputs
        working-directory: backend
        continue-on-error: true
        run: |
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No outputs available yet" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Sentry release for backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: "${{ env.PROJECT_NAME }}-backend"
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          
          # Create release
          sentry-cli releases new "${{ github.sha }}"
          
          # Associate commits (with fallback for missing previous release)
          sentry-cli releases set-commits "${{ github.sha }}" --auto --ignore-missing || \
            echo "Warning: Could not determine previous release, using recent commits"
          
          # Finalize and deploy
          sentry-cli releases finalize "${{ github.sha }}"
          sentry-cli releases deploys "${{ github.sha }}" new -e ${{ env.DEPLOY_ENV }}

      - name: Deployment summary
        run: |
          echo "### Backend Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action || 'plan' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY