version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: synoptik-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      # Core configuration
      - SERVICES=s3,dynamodb,lambda,apigateway,cloudfront,kinesis,sqs,secretsmanager,cloudwatch,iam,sts
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      
      # Persistence
      - PERSISTENCE=1
      - DATA_DIR=/tmp/localstack/data
      
      # AWS Configuration
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      
      # LocalStack Pro features (optional - requires license)
      # - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY}
      
      # Additional configuration
      - EAGER_SERVICE_LOADING=1
      - SKIP_SSL_CERT_DOWNLOAD=1
      
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-data}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - localstack-network

  # Optional: LocalStack Web UI (requires LocalStack Pro)
  # localstack-ui:
  #   image: localstack/localstack-pro
  #   container_name: localstack-ui
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - LOCALSTACK_API_KEY=${LOCALSTACK_API_KEY}
  #   depends_on:
  #     - localstack
  #   networks:
  #     - localstack-network

networks:
  localstack-network:
    driver: bridge

volumes:
  localstack-data:
    driver: local
