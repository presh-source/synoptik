# GraphQL Code Generator Configuration
# This file configures automatic TypeScript type generation from the GraphQL schema
# Run: npm run codegen
# Output: src/graphql/generated/types.ts

overwrite: true
schema: 
  - "../backend/modules/dashboard/appsync/schema.graphql"
  - "./schema-extensions.graphql"
documents: "src/graphql/**/*.ts"
generates:
  src/graphql/generated/types.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      withComponent: false
      withHOC: false
      skipTypename: false
      enumsAsTypes: true
      avoidOptionals:
        field: false
        inputValue: false
        object: false
      scalars:
        AWSDateTime: string
      reactApolloVersion: 4
      addDocBlocks: true
      withMutationFn: false
      withRefetchFn: false
      withSubscriptionHooks: true
      withSuspenseQuery: false
      withLazyQueries: false
      noExport: false
      omitOperationSuffix: false
